<!-- @dsCard group="Spacing" viewport="700x170" name="Radii" subtitle="4px buttons & inputs · 8px cards · never pills" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { background: var(--surface-deep); padding: 28px 36px; font-family: var(--font-body); }
  .row { display: flex; gap: 24px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 88px; height: 64px; background: var(--surface-card); border: 1px solid var(--border-on-dark); }
  .lbl { font-size: 12px; color: var(--text-on-dark-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl">sm · 4px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl">md · 8px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl">lg · 12px</div></div>
    <div class="item"><div class="box" style="width:64px;border-radius:var(--radius-full)"></div><div class="lbl">full · dots only</div></div>
  </div>
</body>
</html>
