<!-- @dsCard group="Colors" viewport="700x170" name="Gray — supporting" subtitle="Supporting text and borders on dark surfaces" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { background: var(--surface-base); padding: 28px; font-family: var(--font-body); }
  .row { display: flex; gap: 16px; }
  .sw { flex: 1; }
  .chip { height: 72px; border-radius: var(--radius-md); }
  .name { font-weight: 500; font-size: 13px; color: var(--text-on-dark); margin-top: 10px; }
  .hex { font-size: 12px; color: var(--text-on-dark-muted); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--gray-mid)"></div><div class="name">Gray Mid</div><div class="hex">#8A97A4 · supporting text</div></div>
    <div class="sw"><div class="chip" style="background:var(--gray-light)"></div><div class="name">Gray Light</div><div class="hex">#B8C2CC · subtle text, borders</div></div>
  </div>
</body>
</html>
