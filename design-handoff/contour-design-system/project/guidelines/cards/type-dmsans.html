<!-- @dsCard group="Type" viewport="700x300" name="DM Sans — body & UI" subtitle="300 body, 400 UI, 500 labels & nav" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { background: var(--surface-light); padding: 32px 36px; font-family: var(--font-body); }
  .block + .block { margin-top: 20px; }
  .spec { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-on-light-muted); margin-bottom: 6px; }
  .lead { font-size: 19px; font-weight: 300; color: var(--text-on-light); line-height: 1.5; max-width: 60ch; }
  .body { font-size: 16px; font-weight: 300; color: var(--text-on-light); line-height: 1.65; max-width: 64ch; }
  .ui { font-size: 15px; font-weight: 400; color: var(--text-on-light); }
  .label { font-size: 13px; font-weight: 500; color: var(--text-on-light); }
</style>
</head>
<body>
  <div class="block"><div class="spec">Lead · 300</div><p class="lead">Fast, modern websites — built, hosted, and tended for you.</p></div>
  <div class="block"><div class="spec">Body · 300</div><p class="body">A good website is the kind of thing you stop thinking about. We survey before we build, build to your situation, then get out of your way.</p></div>
  <div class="block"><div class="spec">UI 400 &nbsp;·&nbsp; Label 500</div><span class="ui">Book a Call</span> &nbsp;&nbsp; <span class="label">Email or Phone</span></div>
</body>
</html>
