<!-- @dsCard group="Colors" viewport="700x190" name="Stone — light surfaces" subtitle="Warm light surfaces, never clinical" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { background: var(--surface-deep); padding: 28px; font-family: var(--font-body); }
  .row { display: flex; gap: 16px; }
  .sw { flex: 1; }
  .chip { height: 84px; border-radius: var(--radius-md); border: 1px solid var(--border-on-dark-hairline); }
  .name { font-weight: 500; font-size: 13px; color: var(--text-on-dark); margin-top: 10px; }
  .hex { font-size: 12px; color: var(--text-on-dark-muted); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--stone)"></div><div class="name">Stone</div><div class="hex">#F2EDE8 · light surface</div></div>
    <div class="sw"><div class="chip" style="background:var(--stone-mid)"></div><div class="name">Stone Mid</div><div class="hex">#E0D9D2 · secondary</div></div>
    <div class="sw"><div class="chip" style="background:var(--stone-dark)"></div><div class="name">Stone Dark</div><div class="hex">#C8BFB6 · borders</div></div>
  </div>
</body>
</html>
