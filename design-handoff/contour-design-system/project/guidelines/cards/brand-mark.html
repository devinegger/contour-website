<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { background: var(--surface-deep); padding: 28px 40px; font-family: var(--font-body); display:flex; align-items:center; gap:48px; }
  .marks { display:flex; align-items:center; gap:32px; }
  .marks img { display:block; }
  .note { font-size: 13px; color: var(--text-on-dark-muted); line-height: 1.6; max-width: 30ch; }
  .note b { color: var(--text-on-dark); font-weight: 500; }
</style>
</head>
<body>
  <div class="marks">
    <img src="../../assets/contour-mark.svg" width="120" height="120" alt="Contour mark large">
    <img src="../../assets/contour-mark.svg" width="56" height="56" alt="Contour mark small">
    <img src="../../assets/favicon.svg" width="40" height="40" alt="Contour favicon">
  </div>
  <p class="note"><b>An open C, nearly closed.</b> Two concentric rings tracing roughly 300° of arc — a contour line that hasn't quite met itself. The gap always faces right.</p>
</body>
</html>
