<!-- @dsCard group="Colors" viewport="700x210" name="Teal — the accent" subtitle="CTAs, active states, eyebrows, the period, topo strokes" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { background: var(--surface-deep); padding: 28px; font-family: var(--font-body); }
  .row { display: flex; gap: 16px; }
  .sw { flex: 1; }
  .chip { height: 84px; border-radius: var(--radius-md); }
  .name { font-weight: 500; font-size: 13px; color: var(--text-on-dark); margin-top: 10px; }
  .hex { font-size: 12px; color: var(--text-on-dark-muted); letter-spacing: 0.02em; }
  .note { font-size: 12px; color: var(--text-on-dark-dim); margin-top: 18px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--teal)"></div><div class="name">Teal</div><div class="hex">#4A8C8C · accent</div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-light)"></div><div class="name">Teal Light</div><div class="hex">#5FA8A8 · hover</div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-dim)"></div><div class="name">Teal Dim</div><div class="hex">#3A7070 · featured cards</div></div>
  </div>
  <p class="note">One accent, used with restraint. Teal carries every interactive and brand signal — including the period in Contour<span style="color:var(--teal)">.</span></p>
</body>
</html>
