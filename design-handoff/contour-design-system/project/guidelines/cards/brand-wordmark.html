<!-- @dsCard group="Brand" viewport="700x200" name="Wordmark & lockup" subtitle="Fraunces 700 · the period is always present, always teal" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { background: var(--surface-deep); padding: 32px 40px; font-family: var(--font-body); display:flex; flex-direction:column; gap:24px; }
  .lockup { display:flex; align-items:center; gap:12px; }
  .word { font-family: var(--font-heading); font-weight:700; font-size:34px; color: var(--text-on-dark); letter-spacing:-0.01em; }
  .word .dot { color: var(--teal); }
  .onlight { background: var(--surface-light); padding: 14px 18px; border-radius: var(--radius-md); display:inline-flex; align-items:center; gap:10px; }
  .onlight .word { color: var(--text-on-light); font-size:26px; }
</style>
</head>
<body>
  <div class="lockup">
    <img src="../../assets/contour-mark.svg" width="44" height="44" alt="">
    <span class="word">Contour<span class="dot">.</span></span>
  </div>
  <div class="onlight">
    <img src="../../assets/contour-mark.svg" width="32" height="32" alt="">
    <span class="word">Contour<span class="dot">.</span></span>
  </div>
</body>
</html>
